# SKAARHOJ PTZ Extreme test page: 47 buttons laid out like the panel's hardware
# components, for testing the companion-surface-skaarhoj-rawpanel plugin.
#
# Provenance: reference/python-prototype/fill_page20.py (build_layout()), which
# wrote the same content to page 20. This file targets page 99 instead;
# test/skaarhoj-test-page.test.ts proves it reproduces the prototype's page 20
# exactly, apart from generated ids and the page number.
#
# Apply order: variables.yaml FIRST, then this file. The page apply refuses any
# button whose actions or text name a custom variable that does not exist yet
# (only $(custom:...) references are checked; $(internal:time_hms) is fine).
#
# Grid: the install's grid must allow rows 0-3 and columns 0-16 (Companion's
# Settings, Buttons, grid size). On a smaller grid the apply is refused at the
# first button outside it, before anything is written.
#
# Page 99: Companion loads pages 1, 2, 3, ... up to the first missing number.
# If the install has N < 98 pages, this apply also creates the gap pages
# N + 1 ... 98, empty and named PAGE (ADR 0004), and every surface's page
# up/down then cycles through them. The tool does not remove them afterwards.
# If page 99 exists, its name and every control on it are replaced.
#
# Buttons: plain buttons add 1 to sk_presses and set sk_last to their name.
# Encoders count their variable down (rotate left) and up (rotate right), and
# reset it to 0 on push. S9 is a two-step latch: red OFF on step 1, green ON on
# step 2. Text colours come from the background's brightness (no textColor).
kind: page
page: 99
name: SKAARHOJ TEST
buttons:
  - location: { row: 0, column: 0 }
    text: "Last\n$(custom:sk_last)\n$(custom:sk_presses)"
    background: "#000080"
  - location: { row: 0, column: 1 }
    text: "Iris $(custom:sk_iris)\nFocus $(custom:sk_focus)"
    background: "#202020"
  - location: { row: 0, column: 2 }
    text: "$(internal:time_hms)"
    background: "#202020"
  - location: { row: 0, column: 3 }
    text: "E1 #46\n$(custom:sk_enc1)"
    background: "#400000"
    down:
      - { action: set, variable: sk_enc1, value: "0" }
      - { action: set, variable: sk_last, value: "E1 push" }
    rotate_left: [{ action: decrement, variable: sk_enc1 }]
    rotate_right: [{ action: increment, variable: sk_enc1 }]
